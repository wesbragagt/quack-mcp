version: '3.8'

services:
  quack-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quack-mcp
    volumes:
      # Mount data directory for CSV access
      - ./data:/app/data:ro
      # Mount additional CSV files from host if needed
      - ./csv-data:/app/csv-data:ro
    environment:
      - PYTHONPATH=/app/src
    stdin_open: true
    tty: true
    # For stdio transport, we need to keep stdin/stdout available
    command: ["uv", "run", "python", "-m", "quack_mcp.server"]
    
  # Optional: Development service with hot reload
  quack-mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quack-mcp-dev
    volumes:
      - ./src:/app/src:rw
      - ./data:/app/data:ro
      - ./csv-data:/app/csv-data:ro
    environment:
      - PYTHONPATH=/app/src
    stdin_open: true
    tty: true
    # For development, we can use watchfiles for hot reload
    command: ["uv", "run", "watchfiles", "--ignore-paths", ".git", "python", "-m", "quack_mcp.server", "src/"]